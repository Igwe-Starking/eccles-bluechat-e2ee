name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guards (no INTERNET, no secrets, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # FIX LINE ENDINGS HERE TOO SO GUARDS DON'T FAIL
      - name: Fix Gradlew Line Endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          
      - name: Run guards
        run: bash scripts/ci.sh --fast

  test-and-build:
    name: Unit tests and debug build
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      # <<<<<< THIS STEP FIXES IT PERMANENTLY ON THE SERVER >>>>>>
      - name: Fix Gradlew Windows Line Endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: bash scripts/setup-sdk.sh
      - name: Unit tests
        run: bash scripts/test.sh
      - name: Debug build
        run: bash scripts/build.sh debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EcclesBluechat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

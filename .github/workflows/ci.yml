name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guards (no INTERNET, no secrets, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guards
        run: bash scripts/ci.sh --fast

  test-and-build:
    name: Unit tests and debug build
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # THIS STEP COMPLETELY OVERWRITES YOUR LOCAL GRADLEY WITH A FRESH CLOUD VERSION
      - name: Generate Fresh Linux Gradle Wrapper
        run: |
          rm -f gradlew
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Prepare Android SDK
        run: bash scripts/setup-sdk.sh
        
      - name: Unit tests
        run: bash scripts/test.sh
        
      - name: Debug build
        run: bash scripts/build.sh debug
        
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EcclesBluechat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
